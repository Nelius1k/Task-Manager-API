name: CI

# Defines when the workflow runs
on:
  push:
   branches:
     - main
  pull_request:
   branches:
     - main

# Defines the actual machine instructions
jobs:
  build:
    
    runs-on: ubuntu-latest

    services: 
      postgres:
        
        image: postgres:16
        
        env:
          POSTGRES_DB: task_manager_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password123
        
        ports: 
          - 5434:5432
        
        options: >-
          # Check if Postgres can accept connections
          --health-cmd pg_isready

          # Rery every 10 seconds
          --health-interval 10s

          # Wait max 5 seconds for each check
          --health-timeout 5s

          # Try 5 times before declaring failure
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run tests
        run: mvn test
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/task_manager_db
          SPRING_DATASOURCE_USERNAME: postgres
          SPRING_DATASOURCE_PASSWORD: password123


  
