name: CI

# Defines when the workflow runs
on:
  push:
   branches:
     - main
  pull_request:
   branches:
     - main

# Defines the actual machine instructions
jobs:
  build:
    
   runs-on: ubuntu-latest

   steps:
     - name: Checkout code
       uses: actions/checkout@v4

     - name: Set up JDK 21
       uses: actions/setup-java@v4
       with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

     - name: Run tests
       run: mvn test